<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fc">
<title>KR Calculator A — Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#1769ff;--text:#17233c;--muted:#718096}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px 16px;
 background:radial-gradient(circle at 5% 5%,#dfeaff,transparent 36%),radial-gradient(circle at 95% 95%,#e8e8ff,transparent 36%),#f5f7fc;
 color:var(--text);font-family:Arial,"Noto Sans Bengali",sans-serif}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.container{width:100%;max-width:410px}
.card{background:#fff;border:1px solid #fff;border-radius:26px;padding:30px 23px 25px;text-align:center;box-shadow:0 18px 60px #253f7015}
.logo{width:76px;height:76px;display:grid;place-items:center;margin:0 auto 17px;border-radius:24px;color:#fff;
 background:linear-gradient(145deg,#3985ff,#124cce);font-size:28px;font-weight:900;letter-spacing:-2px;box-shadow:0 8px 25px #1769ff35}
h1{font-size:24px;font-weight:800;overflow-wrap:anywhere}
.subtitle{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.9}
.divider{height:1px;background:#edf0f6;margin:25px 0}
.google-button{width:100%;min-height:56px;display:flex;align-items:center;justify-content:center;gap:12px;padding:13px;
 border:1px solid #dce2ec;border-radius:15px;background:#fff;color:#253149;font-weight:700;font-size:15px}
.google-button:active{background:#f1f5ff}
.google-icon{width:24px;height:24px;flex-shrink:0}
.status{display:none;padding:12px;margin-top:16px;border-radius:12px;font-size:13px;line-height:1.8;text-align:left;overflow-wrap:anywhere;white-space:pre-wrap}
.status.show{display:block}
.status.error{color:#a32119;background:#fff0ef}
.status.success{color:#126b41;background:#eaf9f0}
.status.warning{color:#8b5500;background:#fff6df}
.privacy{margin-top:19px;color:#8994a8;font-size:12px;line-height:1.8}
.profile{display:none;text-align:center}
.profile.active{display:block}
.photo{width:92px;height:92px;object-fit:cover;border-radius:50%;border:4px solid #e5edff;background:#edf2fa;margin:0 auto 15px;display:block}
.verified{display:inline-block;margin-top:10px;padding:7px 12px;border-radius:30px;color:#147b4a;background:#e9f9f0;font-size:12px;font-weight:700}
.code{margin-top:16px;padding:14px;border-radius:16px;background:#eef4ff;color:#124cce}
.code small{display:block;font-size:12px;color:#5b6b88;margin-bottom:4px}
.code b{font-size:28px;letter-spacing:5px}
.info{margin-top:16px;padding:6px 16px;border-radius:16px;background:#f6f8fc;text-align:left}
.row{padding:11px 0;border-bottom:1px solid #e7edf5;overflow-wrap:anywhere}
.row:last-child{border:0}
.label{display:block;color:#718096;font-size:12px;margin-bottom:5px}
.value{font-size:14px;font-weight:600;line-height:1.7}
.logout{width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;background:#fff0ef;color:#c62828;font-weight:700}
.footer{text-align:center;padding-top:20px;color:#8a95a8;font-size:12px}
.google-button:disabled{opacity:.85;cursor:wait}
.loader{width:20px;height:20px;border:3px solid #cad9ff;border-top-color:#1769ff;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="container">
<section class="card">

  <div id="loginSection">
    <div class="logo">KR</div>
    <h1>KR Calculator A</h1>
    <p class="subtitle">আপনার অ্যাকাউন্টে প্রবেশ করতে<br>Google দিয়ে নিরাপদে লগইন করুন।</p>
    <div class="divider"></div>
    <button type="button" id="googleLogin" class="google-button">
      <svg class="google-icon" viewBox="0 0 48 48" aria-label="Google">
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.74 7.18l7.72 5.99c4.51-4.17 7.06-10.31 7.06-17.64z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.81l-7.72-5.99c-2.14 1.45-4.89 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        <path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78l7.97-6.19z"/>
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      </svg>
      <span id="btnText">Google দিয়ে চালিয়ে যান</span>
    </button>
    <div id="loginStatus" class="status" role="status"></div>
    <p class="privacy">🔒 আপনার প্রোফাইল Firebase-এ সংরক্ষিত হবে।</p>
  </div>

  <div id="profileSection" class="profile">
    <img id="profilePhoto" class="photo" alt="প্রোফাইল ছবি" hidden>
    <h1 id="profileName">ব্যবহারকারী</h1>
    <div class="verified">✓ সফলভাবে লগইন হয়েছে</div>
    <div class="code"><small>আপনার ৮ সংখ্যার আইডি</small><b id="userCode">--------</b></div>
    <div class="info">
      <div class="row"><span class="label">নাম</span><div class="value" id="userName">—</div></div>
      <div class="row"><span class="label">ইমেইল</span><div class="value" id="userEmail">—</div></div>
    </div>
    <div id="profileStatus" class="status" role="status"></div>
    <button id="logoutButton" type="button" class="logout">লগআউট করুন</button>
  </div>

</section>
<div class="footer">© <span id="year"></span> KR Calculator A<br><span style="font-size:11px">ডোমেইন: <b id="domainShow"></b></span></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getDatabase, ref, get, update, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUrso1G3orSxiZGTQ1vNYnmN0jdnJ3nSM",
  authDomain: "kr-calculator-a-bc1e2.firebaseapp.com",
  databaseURL: "https://kr-calculator-a-bc1e2-default-rtdb.firebaseio.com",
  projectId: "kr-calculator-a-bc1e2",
  storageBucket: "kr-calculator-a-bc1e2.firebasestorage.app",
  messagingSenderId: "916522220428",
  appId: "1:916522220428:web:b39f14d38c9fe45ecaf4a9",
  measurementId: "G-K4XGHWM4QF"
};
const HOSTED_URL = "https://kr-calculator-a-bc1e2.web.app";
/* শুধু Firebase-এর অনুমোদিত ডোমেইনে চলবে; অন্য কোনো http(s) ঠিকানা হলে সরাসরি সেখানে পাঠিয়ে দেবে */
const h = location.hostname;
const allowedHost = /(^|\.)(web\.app|firebaseapp\.com)$/.test(h) || h === "localhost" || h === "127.0.0.1";
if ((location.protocol === "http:" || location.protocol === "https:") && !allowedHost) {
  location.replace(HOSTED_URL + "/");
}

const $ = id => document.getElementById(id);
$("year").textContent = new Date().getFullYear();
$("domainShow").textContent = location.hostname || location.protocol;

function status(el, msg, type = "info") { el.textContent = msg; el.className = "status show " + type; }
function clearStatus(el) { el.textContent = ""; el.className = "status"; }

/* ৮ সংখ্যার আইডি: UID থেকে তৈরি, প্রতিবার একই থাকে */
function code8(uid) {
  let h = 2166136261;
  for (const c of uid) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return String(10000000 + (h % 90000000));
}

function showLogin() {
  $("loginSection").hidden = false;
  $("profileSection").classList.remove("active");
  clearStatus($("profileStatus"));
}

function showProfile(user) {
  $("loginSection").hidden = true;
  $("profileSection").classList.add("active");
  const name = user.displayName || "ব্যবহারকারী";
  $("profileName").textContent = name;
  $("userName").textContent = name;
  $("userEmail").textContent = user.email || "ইমেইল পাওয়া যায়নি";
  $("userCode").textContent = code8(user.uid);
  const img = $("profilePhoto");
  if (user.photoURL) {
    img.onerror = () => { img.hidden = true; };
    img.src = user.photoURL;
    img.hidden = false;
  } else img.hidden = true;
}

/* ব্যাকগ্রাউন্ডে সেভ — স্ক্রিন আটকায় না */
async function saveProfile(user) {
  try {
    const userRef = ref(db, "users/" + user.uid);
    const snap = await get(userRef);
    const data = {
      uid: user.uid,
      name: user.displayName || "",
      email: user.email || "",
      photoURL: user.photoURL || "",
      userCode: code8(user.uid),
      provider: "google.com",
      lastLoginAt: serverTimestamp()
    };
    if (!snap.exists()) data.createdAt = serverTimestamp();
    await update(userRef, data);
  } catch (e) {
    console.error("Profile save error:", e);
    status($("profileStatus"), "লগইন সফল, কিন্তু প্রোফাইল সেভ হয়নি। Database Rules পরীক্ষা করুন।", "warning");
  }
}

/* ফাইল ভুল জায়গা থেকে খুললে সাথে সাথে জানাবে, আটকে থাকবে না */
const okProtocol = location.protocol === "http:" || location.protocol === "https:";
if (!okProtocol) {
  status($("loginStatus"),
    "এই পেজ এখন ফোনের ফাইল/এডিটর (" + location.protocol + ") থেকে খোলা, তাই Google লগইন চলবে না।\nFirebase Hosting-এ আপলোড করে এই লিংকে খুলুন:\n" + HOSTED_URL, "warning");
  
} else {
  if (/\.(web\.app|firebaseapp\.com)$/.test(location.hostname)) firebaseConfig.authDomain = location.hostname;
  const app = initializeApp(firebaseConfig);
  window.auth = getAuth(app);
  window.db = getDatabase(app);
  const auth = window.auth;

  const provider = new GoogleAuthProvider();
  provider.addScope("email");
  provider.addScope("profile");
  provider.setCustomParameters({ prompt: "select_account" });

  let busy = false, timer = null;
  const btn = $("googleLogin");
  function setBusy(on) {
    busy = on;
    btn.disabled = on;
    $("btnText").textContent = on ? "Google খুলছে..." : "Google দিয়ে চালিয়ে যান";
    const sp = btn.querySelector(".loader"), ic = btn.querySelector("svg");
    if (on) {
      ic.hidden = true;
      if (!sp) { const l = document.createElement("span"); l.className = "loader"; btn.prepend(l); }
    } else {
      if (sp) sp.remove();
      ic.hidden = false;
      clearTimeout(timer);
    }
  }

  btn.addEventListener("click", async () => {
    if (busy) return;
    clearStatus($("loginStatus"));
    setBusy(true);
    /* সর্বোচ্চ ১০ সেকেন্ড — এরপর বাটন আবার চালু হবে, কখনো আটকে থাকবে না */
    timer = setTimeout(() => {
      setBusy(false);
      status($("loginStatus"), "Google পেজ খোলেনি। আবার চেষ্টা করুন। সমস্যা থাকলে Chrome-এ " + HOSTED_URL + " লিংকে খুলুন।", "warning");
    }, 10000);
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      const c = e?.code || "";
      if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment" || c === "auth/web-storage-unsupported") {
        try { await signInWithRedirect(auth, provider); return; } catch (e2) { e = e2; }
      }
      if (c !== "auth/popup-closed-by-user" && c !== "auth/cancelled-popup-request") {
        const msgs = {
          "auth/unauthorized-domain": "পেজটি এই ঠিকানা থেকে খোলা হয়েছে:\n" + location.origin + "\nএই ডোমেইন Firebase-এর Authorized domains তালিকায় নেই। ঠিক এই ডোমেইন (" + location.hostname + ") যোগ করুন, অথবা " + HOSTED_URL + " লিংকে খুলুন।",
          "auth/operation-not-allowed": "Firebase Console → Authentication → Sign-in method-এ Google চালু করুন।",
          "auth/network-request-failed": "ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।"
        };
        status($("loginStatus"), msgs[e.code] || ("লগইন ব্যর্থ। কোড: " + (e.code || "unknown")), "error");
      }
      setBusy(false);
    }
  });

  $("logoutButton").addEventListener("click", async () => {
    try { await signOut(auth); } catch (e) { status($("profileStatus"), "লগআউট ব্যর্থ হয়েছে।", "error"); }
  });

  onAuthStateChanged(auth, user => {
    if (!user) { showLogin(); return; }
    setBusy(false);
    showProfile(user);          // সাথে সাথে দেখাবে
    saveProfile(user);          // পেছনে সেভ হবে
  });

  getRedirectResult(auth).catch(() => {});
}
</script>
</body>
</html>
